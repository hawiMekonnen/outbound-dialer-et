version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Automatic Dialer Web Application (PHP + Apache + Dual DB Support)
  # ----------------------------------------------------------------------------
  autodialer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethio_dialer_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - DB_DRIVER=${DB_DRIVER:-pgsql}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-ethio_dialer}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-ethiodialer123}
      - ESL_HOST=${ESL_HOST:-127.0.0.1}
      - ESL_PORT=${ESL_PORT:-8021}
      - ESL_PASSWORD=${ESL_PASSWORD:-ClueCon}
      - SIP_DEFAULT_CALLER_ID=${SIP_DEFAULT_CALLER_ID:-+251911002233}
      - DEFAULT_PACING_MODE=${DEFAULT_PACING_MODE:-predictive}
      - MAX_CONCURRENT_CALLS=${MAX_CONCURRENT_CALLS:-1000}
      - CALLS_PER_SECOND=${CALLS_PER_SECOND:-17}
    volumes:
      - dialer_data:/var/www/html/data
      - dialer_audio:/var/www/html/assets/audio
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dialer_net

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL Enterprise Database (Dedicated High-Throughput Engine)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ethio_dialer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ethio_dialer}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ethiodialer123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ethio_dialer}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dialer_net

volumes:
  postgres_data:
    driver: local
  dialer_data:
    driver: local
  dialer_audio:
    driver: local

networks:
  dialer_net:
    driver: bridge
